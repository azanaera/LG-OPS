<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="How a shipment works in 11 steps: ask for a price, quote and yes, hand over details, book space, manager check, collect and check, shipping document, customs out, depart, arrive and deliver, bill and close.">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44505e"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="16" y="34" font-size="22" font-weight="700" fill="#15202b">How a shipment works, start to finish</text>
<text x="16" y="56" font-size="13" fill="#55657a">Read in number order. Each row continues where the last one ended.</text>
<rect x="470" y="22" width="14" height="14" rx="3" fill="#e2edfa" stroke="#1d5aa6" stroke-width="1.5"/><text x="490" y="34" font-size="12" fill="#15202b">Sell</text>
<rect x="534" y="22" width="14" height="14" rx="3" fill="#efe6fa" stroke="#6a3fa0" stroke-width="1.5"/><text x="554" y="34" font-size="12" fill="#15202b">Plan and approve</text>
<rect x="682" y="22" width="14" height="14" rx="3" fill="#fff3d4" stroke="#b9851a" stroke-width="1.5"/><text x="702" y="34" font-size="12" fill="#15202b">Move the cargo</text>
<rect x="816" y="22" width="14" height="14" rx="3" fill="#e1f3ea" stroke="#237a52" stroke-width="1.5"/><text x="836" y="34" font-size="12" fill="#15202b">Arrive and bill</text>
<rect x="16" y="90" width="222" height="104" rx="10" fill="#e2edfa" stroke="#1d5aa6" stroke-width="1.8"/>
<circle cx="38" cy="114" r="13" fill="#1d5aa6"/><text x="38" y="119" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="60" y="119" font-size="15" font-weight="700" fill="#15202b">Ask for a price</text>
<text x="30" y="144" font-size="12.5" fill="#2b3a4a">Customer says what is moving,</text>
<text x="30" y="161" font-size="12.5" fill="#2b3a4a">from where to where, and by</text>
<text x="30" y="178" font-size="12.5" fill="#2b3a4a">when</text>
<rect x="266" y="90" width="222" height="104" rx="10" fill="#e2edfa" stroke="#1d5aa6" stroke-width="1.8"/>
<circle cx="288" cy="114" r="13" fill="#1d5aa6"/><text x="288" y="119" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="310" y="119" font-size="15" font-weight="700" fill="#15202b">Quote and yes</text>
<text x="280" y="144" font-size="12.5" fill="#2b3a4a">We price it, the customer</text>
<text x="280" y="161" font-size="12.5" fill="#2b3a4a">accepts, and we open a file</text>
<rect x="516" y="90" width="222" height="104" rx="10" fill="#e2edfa" stroke="#1d5aa6" stroke-width="1.8"/>
<circle cx="538" cy="114" r="13" fill="#1d5aa6"/><text x="538" y="119" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="560" y="119" font-size="15" font-weight="700" fill="#15202b">Hand over details</text>
<text x="530" y="144" font-size="12.5" fill="#2b3a4a">Invoice, list of boxes, who</text>
<text x="530" y="161" font-size="12.5" fill="#2b3a4a">sends and who receives</text>
<rect x="766" y="90" width="222" height="104" rx="10" fill="#efe6fa" stroke="#6a3fa0" stroke-width="1.8"/>
<circle cx="788" cy="114" r="13" fill="#6a3fa0"/><text x="788" y="119" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="810" y="119" font-size="15" font-weight="700" fill="#15202b">Book space</text>
<text x="780" y="144" font-size="12.5" fill="#2b3a4a">Reserve room on a ship or plane</text>
<rect x="766" y="252" width="222" height="104" rx="10" fill="#efe6fa" stroke="#6a3fa0" stroke-width="1.8"/>
<circle cx="788" cy="276" r="13" fill="#6a3fa0"/><text x="788" y="281" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="810" y="281" font-size="15" font-weight="700" fill="#15202b">Manager check</text>
<text x="780" y="306" font-size="12.5" fill="#2b3a4a">Approve it, or send it back</text>
<text x="780" y="323" font-size="12.5" fill="#2b3a4a">with a note</text>
<rect x="516" y="252" width="222" height="104" rx="10" fill="#fff3d4" stroke="#b9851a" stroke-width="1.8"/>
<circle cx="538" cy="276" r="13" fill="#b9851a"/><text x="538" y="281" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="560" y="281" font-size="15" font-weight="700" fill="#15202b">Collect and check</text>
<text x="530" y="306" font-size="12.5" fill="#2b3a4a">Truck brings the goods in;</text>
<text x="530" y="323" font-size="12.5" fill="#2b3a4a">staff count and weigh them</text>
<rect x="266" y="252" width="222" height="104" rx="10" fill="#fff3d4" stroke="#b9851a" stroke-width="1.8"/>
<circle cx="288" cy="276" r="13" fill="#b9851a"/><text x="288" y="281" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="310" y="281" font-size="15" font-weight="700" fill="#15202b">Shipping document</text>
<text x="280" y="306" font-size="12.5" fill="#2b3a4a">The receipt and contract for</text>
<text x="280" y="323" font-size="12.5" fill="#2b3a4a">the trip; customer approves it</text>
<rect x="16" y="252" width="222" height="104" rx="10" fill="#fff3d4" stroke="#b9851a" stroke-width="1.8"/>
<circle cx="38" cy="276" r="13" fill="#b9851a"/><text x="38" y="281" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="60" y="281" font-size="15" font-weight="700" fill="#15202b">Customs out</text>
<text x="30" y="306" font-size="12.5" fill="#2b3a4a">Government gives permission for</text>
<text x="30" y="323" font-size="12.5" fill="#2b3a4a">the goods to leave</text>
<rect x="16" y="414" width="222" height="104" rx="10" fill="#fff3d4" stroke="#b9851a" stroke-width="1.8"/>
<circle cx="38" cy="438" r="13" fill="#b9851a"/><text x="38" y="443" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">9</text>
<text x="60" y="443" font-size="15" font-weight="700" fill="#15202b">Depart</text>
<text x="30" y="468" font-size="12.5" fill="#2b3a4a">Ship or plane leaves; we warn</text>
<text x="30" y="485" font-size="12.5" fill="#2b3a4a">our partner abroad</text>
<rect x="266" y="414" width="222" height="104" rx="10" fill="#e1f3ea" stroke="#237a52" stroke-width="1.8"/>
<circle cx="288" cy="438" r="13" fill="#237a52"/><text x="288" y="443" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">10</text>
<text x="310" y="443" font-size="15" font-weight="700" fill="#15202b">Arrive and deliver</text>
<text x="280" y="468" font-size="12.5" fill="#2b3a4a">Customs at the other end,</text>
<text x="280" y="485" font-size="12.5" fill="#2b3a4a">delivery, signed proof</text>
<rect x="516" y="414" width="222" height="104" rx="10" fill="#e1f3ea" stroke="#237a52" stroke-width="1.8"/>
<circle cx="538" cy="438" r="13" fill="#237a52"/><text x="538" y="443" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">11</text>
<text x="560" y="443" font-size="15" font-weight="700" fill="#15202b">Bill and close</text>
<text x="530" y="468" font-size="12.5" fill="#2b3a4a">Invoice the customer, pay</text>
<text x="530" y="485" font-size="12.5" fill="#2b3a4a">suppliers, lock the month</text>
<line x1="240" y1="142.0" x2="262" y2="142.0" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="142.0" x2="512" y2="142.0" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="740" y1="142.0" x2="762" y2="142.0" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="877.0" y1="196" x2="877.0" y2="248" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="764" y1="304.0" x2="742" y2="304.0" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="514" y1="304.0" x2="492" y2="304.0" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="264" y1="304.0" x2="242" y2="304.0" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="127.0" y1="358" x2="127.0" y2="410" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="240" y1="466.0" x2="262" y2="466.0" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<line x1="490" y1="466.0" x2="512" y2="466.0" stroke="#44505e" stroke-width="2" marker-end="url(#a)"/>
<text x="16" y="538" font-size="12" fill="#55657a">Row 2 runs right to left. Throughout: staff type in tracking updates, and the public can look up where a shipment is.</text></svg>